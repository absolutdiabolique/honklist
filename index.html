<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HONK DEMONLIST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #2a2a3a;
      --accent: #ff3f00;
      --accent2: #ff8800;
      --gold: #ffd700;
      --text: #e8e8f0;
      --muted: #6a6a80;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      z-index: 9999;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      text-align: center;
      padding: 3rem 1rem 2rem;
      overflow: hidden;
      border-bottom: 2px solid var(--accent);
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,63,0,0.18) 0%, transparent 70%);
    }

    .site-title {
      font-family: 'Black Ops One', cursive;
      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--accent);
      text-shadow:
        0 0 20px rgba(255,63,0,0.7),
        0 0 60px rgba(255,63,0,0.3),
        4px 4px 0 #000;
      position: relative;
    }

    .site-subtitle {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(1rem, 3vw, 1.6rem);
      letter-spacing: 0.4em;
      color: var(--accent2);
      margin-top: 0.3rem;
      position: relative;
    }

    .honk-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 12px rgba(255,136,0,0.8));
      animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding: 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      flex-wrap: wrap;
    }

    .stats-bar span strong { color: var(--accent2); }

    /* ── LAYOUT ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .section-label {
      font-family: 'Bebas Neue', cursive;
      font-size: 0.9rem;
      letter-spacing: 0.35em;
      color: var(--muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── LEADERBOARD ── */
    .leaderboard {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .level-card {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
      gap: 1rem;
    }

    .level-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,63,0,0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .level-card:hover,
    .level-card:focus-visible {
      border-color: var(--accent);
      border-left-color: var(--accent);
      background: var(--surface2);
      outline: none;
    }

    .level-card:hover::before { opacity: 1; }

    .level-card[data-rank="1"] { border-left-color: var(--gold); }
    .level-card[data-rank="2"] { border-left-color: #c0c0c0; }
    .level-card[data-rank="3"] { border-left-color: #cd7f32; }

    .rank {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1;
    }

    .level-card[data-rank="1"] .rank { color: var(--gold); text-shadow: 0 0 12px rgba(255,215,0,0.5); }
    .level-card[data-rank="2"] .rank { color: #c0c0c0; }
    .level-card[data-rank="3"] .rank { color: #cd7f32; }

    .level-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .level-title {
      font-family: 'Black Ops One', cursive;
      font-size: 1.1rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.03em;
    }

    .level-sub {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .rate-display {
      text-align: right;
      white-space: nowrap;
    }

    .rate-number {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .rate-label {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-top: none;
      padding: 1.2rem 1.4rem 1.4rem;
      margin-top: -0.4rem;
      margin-bottom: 0.4rem;
      animation: slideDown 0.18s ease;
    }

    .detail-panel.open { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .detail-stat-label {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.15rem;
    }

    .detail-stat-value {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.45rem;
      color: var(--text);
      line-height: 1.2;
    }

    .detail-actions { margin-top: 0.6rem; }

    .btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 0.4rem 1rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s, color 0.15s;
    }

    .btn:hover { background: var(--accent); color: #000; }

    /* ── LOADING / EMPTY ── */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .empty-state .big {
      font-family: 'Black Ops One', cursive;
      font-size: 2.5rem;
      color: var(--accent);
      display: block;
      margin-bottom: 0.5rem;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    /* ── MOBILE ── */
    @media (max-width: 520px) {
      .stats-bar { gap: 1.5rem; }
      .level-card { grid-template-columns: 40px 1fr auto; gap: 0.6rem; }
      .rank { font-size: 1.4rem; }
      .rate-number { font-size: 1.1rem; }
      .level-title { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <header>
    <span class="honk-icon">🪿</span>
    <h1 class="site-title">DEMONLIST</h1>
    <p class="site-subtitle">HONK · RANKED BY DIFFICULTY</p>
  </header>

  <div class="stats-bar">
    <span>LEVELS: <strong id="totalLevels">—</strong></span>
    <span>HARDEST: <strong id="hardestLevel">—</strong></span>
    <span>TOTAL ATTEMPTS: <strong id="totalAttempts">—</strong></span>
  </div>

  <main class="container">
    <p class="section-label">RANKED LEVELS</p>
    <div class="leaderboard" id="leaderboard">
      <div class="loading">LOADING DEMONLIST...</div>
    </div>
  </main>

  <footer>
    HONK DEMONLIST &mdash; STATS BY u/flappy-goose &mdash; NOT AFFILIATED WITH HONK
  </footer>

  <script>
    // Compute success rate as (completions / attempts) * 100,
    // displayed to 5 significant figures.
    function computeRate(attempts, completions) {
      if (!attempts || attempts === 0) return null;
      return (completions / attempts) * 100;
    }

    function fmtRate(attempts, completions) {
      const r = computeRate(attempts, completions);
      return r !== null ? r.toPrecision(5) + '%' : '—%';
    }

    function fmtNum(n) {
      return n != null ? n.toLocaleString() : '—';
    }

    function fmtTime(t) {
      return t ? t + 's' : '—';
    }

    function toggleDetail(i) {
      const panel = document.getElementById('panel-' + i);
      const isOpen = panel.classList.contains('open');
      document.querySelectorAll('.detail-panel.open').forEach(p => p.classList.remove('open'));
      if (!isOpen) {
        panel.classList.add('open');
        document.getElementById('card-' + i).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    async function loadList() {
      const board = document.getElementById('leaderboard');

      let levels;
      try {
        const res = await fetch('data/stats.json');
        if (!res.ok) throw new Error();
        levels = await res.json();
      } catch {
        board.innerHTML = `<div class="empty-state">
          <span class="big">NO DATA</span>
          Add entries to <code>data/stats.json</code> and push to GitHub.
        </div>`;
        return;
      }

      if (!levels?.length) {
        board.innerHTML = `<div class="empty-state">
          <span class="big">EMPTY LIST</span>
          Add level entries to <code>data/stats.json</code>.
        </div>`;
        return;
      }

      // Sort hardest first (lowest success rate = #1). Missing data goes last.
      levels.sort((a, b) => {
        const ra = computeRate(a.attempts, a.completions) ?? Infinity;
        const rb = computeRate(b.attempts, b.completions) ?? Infinity;
        return ra - rb;
      });

      // Update stats bar
      document.getElementById('totalLevels').textContent = levels.length;
      document.getElementById('hardestLevel').textContent = (levels[0]?.title ?? '—').toUpperCase();
      const totalAttempts = levels.reduce((s, l) => s + (l.attempts ?? 0), 0);
      document.getElementById('totalAttempts').textContent = fmtNum(totalAttempts);

      board.innerHTML = '';

      levels.forEach((level, i) => {
        const rank = i + 1;
        const rateStr = fmtRate(level.attempts, level.completions);

        // Card
        const card = document.createElement('div');
        card.className = 'level-card';
        card.id = 'card-' + i;
        card.setAttribute('data-rank', rank);
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.onclick = () => toggleDetail(i);
        card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') toggleDetail(i); };

        card.innerHTML = `
          <div class="rank">#${rank}</div>
          <div class="level-info">
            <div class="level-title">${level.title || '(untitled)'}</div>
            ${level.first_completion
              ? `<div class="level-sub">🥇 FIRST: ${level.first_completion}</div>`
              : ''}
          </div>
          <div class="rate-display">
            <div class="rate-number">${rateStr}</div>
            <div class="rate-label">SUCCESS RATE</div>
          </div>
        `;

        // Detail panel
        const panel = document.createElement('div');
        panel.className = 'detail-panel';
        panel.id = 'panel-' + i;
        panel.innerHTML = `
          <div class="detail-grid">
            <div>
              <div class="detail-stat-label">⏱ FASTEST TIME</div>
              <div class="detail-stat-value">${fmtTime(level.fastest_time)}</div>
            </div>
            <div>
              <div class="detail-stat-label">💀 ATTEMPTS</div>
              <div class="detail-stat-value">${fmtNum(level.attempts)}</div>
            </div>
            <div>
              <div class="detail-stat-label">🏆 COMPLETIONS</div>
              <div class="detail-stat-value">${fmtNum(level.completions)}</div>
            </div>
            <div>
              <div class="detail-stat-label">📊 SUCCESS RATE</div>
              <div class="detail-stat-value">${rateStr}</div>
            </div>
          </div>
          <div class="detail-actions">
            <a class="btn" href="${level.url}" target="_blank" rel="noopener">VIEW ON REDDIT ↗</a>
          </div>
        `;

        board.appendChild(card);
        board.appendChild(panel);
      });
    }

    loadList();
  </script>
</body>
</html>
